
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Piscina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            margin-bottom: 2rem;
        }

        .container-table {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
        }

        h2 { text-align: center; color: #333; margin-bottom: 1.5rem; }

        form { display: flex; flex-direction: column; }

        label { margin-bottom: 0.5rem; color: #555; font-weight: 600; }

        input[type="text"], input[type="date"] {
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
        }

        button {
            padding: 0.75rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover { background-color: #0056b3; }

        .file-upload { margin-bottom: 1rem; }
        .file-upload input[type="file"] { display: none; }
        .file-upload label {
            display: block;
            padding: 0.75rem;
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            color: #555;
            font-weight: 600;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        img { border-radius: 4px; object-fit: cover; }
    </style>
</head>

<body>

    <div class="container">
        <h2>Registro de Piscina</h2>
        <form id="poolForm">
            <label for="nome">Nome do cliente:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="cloro">Dicloro quantidade:</label>
            <input type="text" id="cloro" name="cloro" required>

            <label for="ph">Carbonato de sódio:</label>
            <input type="text" id="ph" name="ph" required>

            <div class="file-upload">
                <label for="fotos">📸 Upload de Fotos</label>
                <input type="file" id="fotos" name="fotos">
            </div>

            <label for="data">Data do Registro:</label>
            <input type="date" id="data" name="data" required>

            <button type="submit">Registrar</button>
        </form>
    </div>

    

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('poolForm');

            // 1. Função para carregar dados da API
            function carregarDados() {
                fetch('https://pool-api-alpha.vercel.app/api/v1/pool/')
                    .then(response => response.json())
                    .then(dados => {
                        const tbody = document.getElementById('tableBody');
                        tbody.innerHTML = ''; 

                        dados.forEach(item => {
                            const linha = document.createElement('tr');
                            linha.innerHTML = `
                                <td>${item.data || '-'}</td>
                                <td>${item.nome}</td>
                                <td>${item.cloro}</td>
                                <td>${item.ph}</td>
                                <td>
                                    ${item.fotos ? `<img src="${item.fotos}" width="60" height="60">` : 'N/A'}
                                </td>
                            `;
                            tbody.appendChild(linha);
                        });
                    })
                    .catch(error => console.error('Erro ao buscar dados:', error));
            }

            // 2. Evento de envio do formulário
            form.addEventListener('submit', function (event) {
                event.preventDefault();
                const formData = new FormData(form);

                fetch('https://pool-api-alpha.vercel.app/api/v1/pool/', {
                    method: 'POST',
                    body: formData 
                })
                .then(response => {
                    if (!response.ok) throw new Error('Erro no servidor');
                    return response.json();
                })
                .then(data => {
                    alert('Sucesso!');
                    form.reset();
                    carregarDados(); // Atualiza a tabela na hora!
                })
                .catch(error => alert('Erro ao enviar dados.'));
            });

            // Carrega a tabela assim que abrir a página
            carregarDados();
        });
    </script>
</body>
</html>
